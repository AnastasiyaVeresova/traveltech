<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelTech — Планируйте свои путешествия</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .header {
      background-color: #007bff;
      color: #fff;
      padding: 15px 0;
      width: 100%;
      text-align: center;
    }
    .header h1 {
      margin: 0;
    }
    .main-content {
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 80%;
      max-width: 800px;
      margin-top: 20px;
      text-align: center;
    }
    .main-content h2 {
      color: #333;
    }
    .main-content p {
      color: #666;
      line-height: 1.6;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }
    .button {
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
      color: #fff;
    }
    .login-button {
      background-color: #007bff;
    }
    .register-button {
      background-color: #28a745;
    }
    .button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>TravelTech</h1>
  </div>
  <div class="main-content">
    <h2>Планируйте свои путешествия легко и удобно</h2>
    <p>
      TravelTech — это сервис для планирования и управления вашими поездками.
      Создавайте маршруты, бронируйте отели и рейсы, добавляйте активности и делитесь планами с друзьями.
    </p>
    <div class="buttons">
      <a href="/login.html" class="button login-button">Войти</a>
      <a href="/register.html" class="button register-button">Зарегистрироваться</a>
    </div>
  </div>
</body>
</html>
