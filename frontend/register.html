<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelTech — Регистрация</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .register-container {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 300px;
      text-align: center;
    }
    input {
      width: 93%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <h1>TravelTech</h1>
    <form id="registerForm">
      <input type="text" id="surname" placeholder="Фамилия" required>
      <input type="text" id="name" placeholder="Имя" required>
      <input type="text" id="patronymic" placeholder="Отчество" required>
      <input type="date" id="birthDate" placeholder="Дата рождения" required>
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Пароль" required>
      <input type="text" id="timezone" placeholder="Часовой пояс (например, Europe/Moscow)" required>
      <button type="submit">Зарегистрироваться</button>
    </form>
    <p>Уже есть аккаунт? <a href="/login.html">Войти</a></p>
  </div>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const surname = document.getElementById('surname').value;
      const name = document.getElementById('name').value;
      const patronymic = document.getElementById('patronymic').value;
      const birthDate = document.getElementById('birthDate').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const timezone = document.getElementById('timezone').value;

      try {
        const response = await fetch('http://localhost:3000/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ surname, name, patronymic, birthDate, email, password, timezone }),
        });
        const data = await response.json();
        if (response.ok) {
          alert('Регистрация успешна! Теперь вы можете войти.');
          window.location.href = '/login.html';
        } else {
          alert(data.error || 'Ошибка регистрации');
        }
      } catch (error) {
        console.error('Error:', error);
      }
    });
  </script>
</body>
</html>
